<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conditional Rendering with React</title>
    <!-- React + ReactDOM from CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
    const { useState } = React;

    function App() {
        const [isVisible, setIsVisible] = useState(true);

        return (
            <div>
                <h1>
                    У React умовний рендеринг реалізується за допомогою виразів у JSX.
                    Немає необхідності безпосередньо маніпулювати DOM — React автоматично оновлює його,
                    коли змінюється стан змінної <code>isVisible</code>.
                </h1>
                <button onClick={() => setIsVisible(!isVisible)}>
                    Toggle Visibility
                </button>
                {isVisible && <p>Цей текст відображається умовно</p>}
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
</script>
</body>
</html>
