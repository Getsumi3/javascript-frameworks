<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>React Example</title>
    <!-- React + ReactDOM from CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
    const {useState} = React;

    function App() {
        const [message, setMessage] = useState("");

        return (
            <div>
                <h1>
                    <b>Одностороння прив'язка даних (one-way binding)</b> у React означає, що дані рухаються від стану (<code>state</code>)
                    до інтерфейсу. Коли стан змінюється (наприклад, через <code>onChange</code>), React перерендерює
                    компонент і оновлює DOM, що робить потік даних передбачуваним.
                </h1>
                <label>
                    <input
                        type="text"
                        value={message}
                        onChange={(e) => setMessage(e.target.value)}
                        placeholder="Введіть текст"
                    />
                </label>
                <p>{message}</p>
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App/>);
</script>
</body>
</html>
