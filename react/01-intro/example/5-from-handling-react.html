<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Handling with React</title>
    <!-- React + ReactDOM from CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<ul>
    <li>У цьому прикладі використовується двостороння прив'язка через value + onChange для поля введення.</li>
    <li>Подія submit обробляється через onSubmit, що дозволяє уникнути перезавантаження сторінки.</li>
    <li>React автоматично оновлює привітання через стан <code>greeting</code>.</li>
</ul>
<div id="root"></div>

<script type="text/babel">
    const { useState } = React;

    function App() {
        const [name, setName] = useState("");
        const [greeting, setGreeting] = useState("");

        const submitForm = (e) => {
            e.preventDefault();
            setGreeting(`Привіт, ${name}!`);
        };

        return (
            <div>
                <form onSubmit={submitForm}>
                    <label htmlFor="name">Ваше ім'я:</label>
                    <input
                        type="text"
                        id="name"
                        value={name}
                        onChange={(e) => setName(e.target.value)}
                    />
                    <button type="submit">Відправити</button>
                </form>
                {greeting && <p>{greeting}</p>}
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
</script>
</body>
</html>
