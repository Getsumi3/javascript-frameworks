<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Styles with React</title>
    <!-- React + ReactDOM from CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .highlight {
            background-color: yellow;
            font-weight: bold;
        }
    </style>
</head>
<body>
<ul>
    <li>У React ми використовуємо умовні класи через JSX: className={condition ? 'highlight' : ''}.</li>
    <li>Стан isHighlighted визначає, чи застосувати клас. React автоматично оновлює DOM при зміні стану.</li>
    <li>Кнопка викликає toggleHighlight, яка змінює значення стану isHighlighted.</li>
</ul>
<div id="root"></div>

<script type="text/babel">
    const { useState } = React;

    function App() {
        const [isHighlighted, setIsHighlighted] = useState(false);

        const toggleHighlight = () => {
            setIsHighlighted(!isHighlighted);
        };

        return (
            <div>
                <button onClick={toggleHighlight}>Змінити стиль</button>
                <p className={isHighlighted ? "highlight" : ""}>
                    Цей текст змінює стиль
                </p>
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
</script>
</body>
</html>
